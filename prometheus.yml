global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'spring-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'user-service:8081'
          - 'driver-service:8082'
          - 'ride-service:8083'
          - 'payment-service:8084'
          - 'pricing-service:8085'
          - 'notification-service:8086'
