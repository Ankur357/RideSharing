server:
  port: 8083
spring:
  application:
    name: ride-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ridedb
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
