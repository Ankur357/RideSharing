server:
  port: 8082
spring:
  application:
    name: driver-service
  datasource:
    url: jdbc:postgresql://localhost:5432/driverdb
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: ${JWT_SECRET:ridesharing-super-secret-jwt-key-minimum-256-bits}
